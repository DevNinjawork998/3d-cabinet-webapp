services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cabinet
      POSTGRES_PASSWORD: cabinet
      POSTGRES_DB: cabinet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cabinet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet -d cabinet"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  cabinet_postgres_data:
